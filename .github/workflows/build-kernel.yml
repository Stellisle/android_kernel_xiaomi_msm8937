name: Build Mi8937 Kernel (land)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev zip libelf-dev dwarves curl gcc-aarch64-linux-gnu

      - name: Download AOSP Clang r416183b
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          curl -L -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          $HOME/clang/bin/clang --version

      - name: Build kernel
        run: |
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/msm8937_defconfig
          make O=out -j$(nproc) KCFLAGS="-Wno-error"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-land
          path: out/arch/arm64/boot/
          if-no-files-found: error
