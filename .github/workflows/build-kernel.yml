name: Build Mi8937 Kernel (land)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev zip libelf-dev dwarves git gcc-aarch64-linux-gnu

      - name: Download LineageOS Clang r416183b
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Build kernel
        run: |
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/msm8937_defconfig
          scripts/config --file out/.config \
            --enable ANDROID_VENDOR_HOOKS \
            --disable FAULT_INJECTION \
            --disable FAULT_INJECTION_DEBUG_FS \
            --disable FAULT_INJECTION_STACKTRACE_FILTER \
            --disable FAILSLAB \
            --disable FAIL_PAGE_ALLOC \
            --disable FAIL_MAKE_REQUEST \
            --disable FAIL_IO_TIMEOUT \
            --disable FAIL_FUTEX \
            --disable FAIL_FUNCTION
          make O=out olddefconfig
          make O=out -j$(nproc) KCFLAGS="-Wno-error"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-land
          path: out/arch/arm64/boot/
          if-no-files-found: error
